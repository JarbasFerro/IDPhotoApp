<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <!-- Calipic colour matrix D3: Warm challenger (amber-ochre), treatment 3 (accent mark on dark-mode field). draft v0 stand-in: colour test only, geometry unchanged, not a final icon. mark #F0B55A, field #111214. -->
  <title id="title">Calipic provisional icon draft</title>
  <desc id="desc">A portrait silhouette inside a rounded crop frame with small gaps around the frame and a much wider opening on the right, creating a capital C.</desc>

  <!-- Draft only: geometry is intentionally simple and should be optically refined later. -->
  <rect x="28" y="28" width="968" height="968" rx="216" fill="#111214" stroke="#2C2E33" stroke-width="4"/>

  <!--
    Frame construction rules:
    - all strokes use the same width
    - all line caps are identical and round
    - top and bottom are exact mirrors around y=512
    - small gaps at top center, bottom center, and left center
    - right opening is deliberately much larger to make the frame read as C
  -->
  <g fill="none" stroke="#F0B55A" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- top-left segment -->
    <path d="M 474 172 H 322 C 236 172 180 228 180 314 V 466"/>
    <!-- bottom-left segment: mirror of top-left -->
    <path d="M 180 558 V 710 C 180 796 236 852 322 852 H 474"/>
    <!-- top-right segment -->
    <path d="M 550 172 H 706 C 786 172 842 224 842 298"/>
    <!-- bottom-right segment: mirror of top-right -->
    <path d="M 842 726 C 842 800 786 852 706 852 H 550"/>
  </g>

  <!-- Provisional portrait silhouette. Keep distinctive but simple enough for small icon sizes. -->
  <g fill="#F0B55A">
    <!-- bun -->
    <ellipse cx="520" cy="314" rx="58" ry="48"/>
    <!-- head/hair mass -->
    <ellipse cx="520" cy="472" rx="132" ry="154"/>
    <!-- neck -->
    <path d="M 466 585 C 468 632 455 664 422 682 H 618 C 585 664 572 632 574 585 Z"/>
    <!-- shoulders / bust -->
    <path d="M 422 673 C 360 688 315 722 292 780 H 748 C 725 722 680 688 618 673 C 594 667 578 654 570 636 H 470 C 462 654 446 667 422 673 Z"/>
    <!-- subtle side hair mass to support the loose lock -->
    <path d="M 408 436 C 382 476 382 540 408 580 C 424 604 438 616 449 620 C 430 588 426 552 432 520 C 438 486 448 458 462 436 Z"/>
  </g>

  <!-- Signature loose hair strand as negative-space cutout -->
  <path d="M 582 350 C 578 404 546 435 500 462 C 451 490 425 522 432 565 C 436 590 426 616 404 635"
        fill="none" stroke="#111214" stroke-width="12" stroke-linecap="round"/>
</svg>
